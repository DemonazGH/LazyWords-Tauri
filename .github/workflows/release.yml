name: Release

on:
  push:
    branches:
      - 'codex/release-*'
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -LiteralPath src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw 'Cargo and Tauri versions must match.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the application version.'
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT
          try {
            $release = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v$version" -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
            if (-not $release.draft) { throw 'This version is already published; do not overwrite its assets.' }
          } catch {
            if ($_.Exception.Response.StatusCode -ne 404) { throw }
          }

      - name: Run JavaScript regression tests
        run: npm test

      - name: Run Rust regression tests
        run: cargo test --release --locked
        working-directory: src-tauri

      - name: Build Tauri app
        run: npm run tauri build -- --ci --bundles msi,nsis

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          $files += @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($files.Count -ne 2) { throw 'Expected exactly one MSI and one NSIS installer.' }
          $lines = $files | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllLines("$PWD/SHA256SUMS.txt", $lines, [Text.UTF8Encoding]::new($false))

      - name: Save tested Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: lazywords-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt

      - name: Pin the tested release tag
        if: github.ref_type == 'branch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release tag.' }
          if ($existing) {
            if (($existing -split '\s+')[0] -ne $env:GITHUB_SHA) {
              throw 'Release tag already points to a different commit.'
            }
          } else {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create release tag.' }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot push release tag.' }
          }

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          generate_release_notes: true
