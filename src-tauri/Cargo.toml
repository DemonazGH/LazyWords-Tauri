[package]
name = "lazywords"
version = "1.0.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
csv = "1"
png = "0.17"
calamine = "0.22"
rand = "0.8"
sha2 = "0.10"
chrono = "0.4"
tokio = { version = "1.50.0", features = ["time", "rt", "rt-multi-thread", "macros"] }
sys-locale = "0.3"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"
winapi = { version = "0.3", features = ["winuser", "windef", "synchapi", "errhandlingapi"] }
windows = { version = "0.61.3", features = ["ApplicationModel", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_WinRT"] }
