<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LazyWords</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #1A1A1E;
      color: #f4f4f5;
      border-radius: 14px;
      overflow: hidden;
      user-select: none;
    }

    .card {
      padding: 20px 22px 18px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 2px;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      color: #f4f4f5;
      margin-bottom: 3px;
    }

    .subtitle {
      font-size: 11px;
      color: #71717a;
      margin-bottom: 16px;
    }

    .pack-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .pack-btn {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #f4f4f5;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 10px 10px;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      transition: background 0.12s, border-color 0.12s;
    }

    .pack-btn:hover {
      background: #3f3f46;
      border-color: #6366f1;
    }

    .pack-btn:active {
      background: #4f46e5;
      border-color: #4f46e5;
    }

    .pack-btn.import-btn {
      grid-column: 1 / -1;
      background: #1e1e22;
      color: #a5b4fc;
      text-align: center;
      font-size: 12px;
    }

    .pack-btn.import-btn:hover {
      background: #27272a;
      border-color: #6366f1;
    }

    #status {
      font-size: 11px;
      color: #71717a;
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">LazyWords</div>
    <div class="title" data-i18n="onboarding.title">What do you want to learn?</div>
    <div class="subtitle" data-i18n="onboarding.subtitle">Choose a starter pack or import your own</div>

    <div class="pack-grid">
      <button class="pack-btn" data-pack="en-ru" data-i18n="onboarding.pack.enRu">🇬🇧 English → Russian</button>
      <button class="pack-btn" data-pack="en-definitions" data-i18n="onboarding.pack.enDefs">📖 English Definitions</button>
      <button class="pack-btn" data-pack="en-irregular-verbs" data-i18n="onboarding.pack.irregularVerbs">🔀 Irregular Verbs</button>
      <button class="pack-btn import-btn" id="btn-import" data-i18n="onboarding.pack.import">📂 Import my own…</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="../../tauri-api.js"></script>
  <script>
    let strings = {};

    // Apply locale strings
    window.api.getLocale().then(({ strings: s }) => {
      strings = s;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (s[key] !== undefined) el.textContent = s[key];
      });
    });

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function disableButtons() {
      document.querySelectorAll('.pack-btn').forEach(b => b.disabled = true);
    }

    // Starter pack buttons
    document.querySelectorAll('.pack-btn[data-pack]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const packId = btn.dataset.pack;
        disableButtons();
        setStatus(strings['onboarding.loading'] ?? 'Loading…');
        await window.api.saveSettings({ activeDictionary: packId });
        window.close();
      });
    });

    // Import button
    document.getElementById('btn-import').addEventListener('click', async () => {
      disableButtons();
      setStatus(strings['onboarding.loading'] ?? 'Loading…');
      const result = await window.api.importDictionary();
      if (!result) {
        // Cancelled — re-enable
        document.querySelectorAll('.pack-btn').forEach(b => b.disabled = false);
        setStatus('');
        return;
      }
      if (result.error) {
        document.querySelectorAll('.pack-btn').forEach(b => b.disabled = false);
        setStatus('Error: ' + result.error);
        return;
      }
      await window.api.saveSettings({ activeDictionary: result.id });
      window.close();
    });
  </script>
</body>
</html>
