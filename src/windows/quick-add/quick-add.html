<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LazyWords Quick Add</title>
  <link rel="stylesheet" href="quick-add.css">
</head>
<body>
  <main>
    <h1 data-i18n="quickAdd.title">Quick Add</h1>
    <p class="intro" data-i18n="quickAdd.intro">Cards are saved to My Words. Choose “Save card” to keep practicing your current dictionary.</p>
    <form id="quick-add-form">
      <label for="quick-add-term" data-i18n="quickAdd.term">Term</label>
      <input id="quick-add-term" maxlength="160" required autocomplete="off">
      <label for="quick-add-definition" data-i18n="quickAdd.definition">Definition or translation</label>
      <textarea id="quick-add-definition" maxlength="4000" rows="3" required></textarea>
      <fieldset id="quick-add-suggestion" class="suggestion" hidden>
        <legend data-i18n="quickAdd.useSuggestion">Use a suggested answer</legend>
        <div id="quick-add-options"></div>
      </fieldset>
      <p id="quick-add-status" role="status"></p>
      <div class="actions">
        <button type="button" id="quick-add-cancel" data-i18n="quickAdd.cancel">Cancel</button>
        <button type="submit" id="quick-add-save" data-i18n="quickAdd.save">Save card</button>
        <button type="submit" id="quick-add-practice" data-i18n="quickAdd.practice">Save and practice My Words</button>
      </div>
    </form>
  </main>
  <script src="../../tauri-api.js"></script>
  <script src="quick-add.js"></script>
</body>
</html>
